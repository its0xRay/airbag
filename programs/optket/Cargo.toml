[package]
name = "optket"
version = "0.1.0"
description = "Optket — downside protection for tokenized equities on Solana (two-asset MVP)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "optket"

[features]
default = []
mainnet-beta = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"

[dev-dependencies]
