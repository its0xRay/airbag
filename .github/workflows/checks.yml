name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web-and-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm run check:secrets
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck:server
